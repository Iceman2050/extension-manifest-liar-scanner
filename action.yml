name: "Extension Manifest Liar Scanner"
description: >-
  Compare a browser/VS Code extension manifest.json's declared permissions and data-collection claims against static code analysis. Flags the lie when code exfiltrates what the manifest says it never collects. Fails CI on HIGH/CRITICAL findings. By Ingenious AI.
author: "Ingenious AI"

branding:
  icon: "file-text"
  color: "blue"

inputs:
  manifest:
    description: Path to manifest.json, relative to the repository root.
    required: false
    default: "manifest.json"
  code-glob:
    description: >-
      Glob for JS/TS files to analyze, relative to repo root
      (e.g. 'src/**/*.js'). Empty = manifest only.
    required: false
    default: ""
  fail-on:
    description: >-
      Comma-separated severities that fail the build (e.g. CRITICAL,HIGH).
    required: false
    default: "CRITICAL,HIGH"

outputs:
  verdict:
    description: Worst severity found (CRITICAL, HIGH, MEDIUM, LOW, INFO, or NONE).
    value: ${{ steps.scan.outputs.verdict }}
  findings-count:
    description: Number of findings.
    value: ${{ steps.scan.outputs.findings-count }}

runs:
  using: "composite"
  steps:
    - name: Run Extension Manifest Liar Scanner
      id: scan
      shell: bash
      run: |
        set -u
        REPORT="$RUNNER_TEMP/scan-report.json"
        export FAIL_ON="${{ inputs.fail-on }}"
        python3 "${{ github.action_path }}/extension_manifest_liar_scanner.py" --manifest "${{ github.workspace }}/${{ inputs.manifest }}" $([ -n "${{ inputs.code-glob }}" ] && (cd "${{ github.workspace }}" && for f in ${{ inputs.code-glob }}; do printf -- "--code %s " "$f"; done)) --json > "$REPORT" 2> "$RUNNER_TEMP/scan-stderr.txt" || true
        echo '' | base64 -d > "$RUNNER_TEMP/eval.py"
        python3 "$RUNNER_TEMP/eval.py"
    - name: Fail on findings
      shell: bash
      if: steps.scan.outputs.failed == 'true'
      run: |
        echo "::error::Extension Manifest Liar Scanner found findings at or above the fail-on threshold."
        exit 1
